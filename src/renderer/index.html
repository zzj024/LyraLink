<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- style-src 需要 unsafe-inline：Naive UI 通过 cssinjs 在运行时注入 <style> 标签 -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' https: file: data: blob:; media-src 'self' file: http://127.0.0.1:* blob:; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <title>LyraLink</title>
    <link rel="icon" href="./icon.svg" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/app/main.ts"></script>
  </body>
</html>
